<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="lensCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>
    <radialGradient id="glassFlare" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#0284C7" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#0369A1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0C4A6E" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="200" height="200" rx="28" fill="url(#canvasBg)" />
  <rect width="198" height="198" x="1" y="1" rx="27" fill="none" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Soft Shadow under Camera Body -->
  <ellipse cx="100" cy="154" rx="66" ry="10" fill="#0F172A" opacity="0.16" />

  <!-- Camera Top Pentaprism / Hotshoe -->
  <path d="M 76 66 L 86 48 L 114 48 L 124 66 Z" fill="#1E293B" />
  <rect x="88" y="44" width="24" height="6" rx="1.5" fill="#475569" />
  <rect x="91" y="45" width="18" height="2" fill="#64748B" />

  <!-- Top Dials -->
  <rect x="52" y="58" width="16" height="8" rx="2" fill="#475569" />
  <rect x="54" y="56" width="12" height="3" rx="1" fill="#64748B" />
  <rect x="132" y="58" width="18" height="8" rx="2" fill="#475569" />
  <circle cx="141" cy="55" r="4" fill="#0284C7" />

  <!-- Main Camera Body -->
  <g filter="url(#softShadow)">
    <rect x="38" y="64" width="124" height="80" rx="14" fill="url(#bodyGrad)" />
  </g>

  <!-- Grip Rubber Texture (Right Side) -->
  <path d="M 144 70 L 154 74 L 154 136 L 144 140 Z" fill="#090D16" opacity="0.75" />
  <line x1="147" y1="80" x2="147" y2="132" stroke="#1E293B" stroke-width="1.5" />
  <line x1="151" y1="84" x2="151" y2="128" stroke="#1E293B" stroke-width="1.5" />

  <!-- Cinema Camera Red Recording Accent Dot -->
  <circle cx="54" cy="78" r="3.5" fill="#EF4444" />

  <!-- AF Assist Lamp / Sensor Window -->
  <rect x="126" y="74" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.85" />

  <!-- Outer Metal Lens Mount Ring -->
  <circle cx="98" cy="104" r="37" fill="url(#metalRim)" />
  <circle cx="98" cy="104" r="34" fill="#0F172A" />

  <!-- Lens Ribbed Ring & Focus Barrel -->
  <circle cx="98" cy="104" r="31" fill="#1E293B" stroke="#334155" stroke-width="2" />
  <circle cx="98" cy="104" r="26" fill="url(#lensCoat)" />

  <!-- Deep Lens Core -->
  <circle cx="98" cy="104" r="20" fill="#031A2F" />

  <!-- Multi-Coated Optical Glass & Flare -->
  <circle cx="98" cy="104" r="18" fill="url(#glassFlare)" />
  <circle cx="98" cy="104" r="18" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.6" />

  <!-- Specular Lens Glint / Optical Reflection -->
  <ellipse cx="91" cy="97" rx="8" ry="4" transform="rotate(-38 91 97)" fill="#FFFFFF" opacity="0.7" />
  <circle cx="106" cy="112" r="2.5" fill="#FFFFFF" opacity="0.45" />

  <!-- Subtle Badge Text: 4K / OPTICS -->
  <text x="54" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" fill="#64748B" letter-spacing="1">4K RAW</text>
</svg>
